name: AcadPulse Automated Verification & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Automated Test Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Route & API Tests
        run: |
          python -m unittest backend/test_routes.py

      - name: Compile and Run DSA Verification Suite
        run: |
          g++ -std=c++17 -O2 -I engine/include engine/tests/test_all_dsa.cpp -o test_all_dsa
          ./test_all_dsa
